<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | escape }} · cabeza de chivo">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ page.image | default: '/favicon.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href={{"/assets/css/chivo.css" | relative_url }}>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- <script src="/assets/js/p5.sound.min.js"></script>
  <script src="/assets/js/sketch.js" defer></script> -->
</head>
<body class="grit">
  {% include header.html %}
  <main class="content">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include analytics.html %}
</body>
</html>
